<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimazi Video Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --pop:#FF5D2E; --ice:#7FC4FF; --fg:#EAF2FA; --dim:#8FA3B8; }
  *{box-sizing:border-box} a{color:inherit; text-decoration:none}
  html,body{margin:0; height:100%; background:#05111A; color:var(--fg); font-family:"Hanken Grotesk",system-ui,sans-serif; overflow:hidden}
  #stage{position:fixed; inset:0; overflow:hidden}
  .corebox{position:absolute; left:50%; top:43%; transform:translate(-50%,-50%); z-index:1;
    width:min(760px,92vw); height:min(66vh,580px); display:grid; place-items:center}
  .corebox video{width:100%; height:100%; object-fit:contain; mix-blend-mode:screen; filter:saturate(1.12) contrast(1.08) brightness(1.05);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 28%, rgba(0,0,0,.5) 48%, transparent 63%);
    mask-image:radial-gradient(circle at 50% 50%, #000 28%, rgba(0,0,0,.5) 48%, transparent 63%)}
  .vig{position:absolute; inset:0; z-index:2; pointer-events:none; box-shadow:inset 0 0 260px 70px rgba(3,7,12,.7)}

  .bar{position:absolute; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; justify-content:space-between; padding:24px clamp(24px,5vw,60px)}
  .brand{display:flex; align-items:center; gap:12px; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:1.4rem; letter-spacing:-.02em; color:var(--fg)}
  .brand .mk{width:28px; height:28px; border:1.5px solid var(--ice); border-radius:8px; display:grid; place-items:center; font-size:.92rem; color:var(--ice)}
  .brand i{font-style:normal; color:var(--pop)}
  .cta{font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; padding:12px 18px; border-radius:999px; background:var(--pop); color:#fff}

  .kick{position:absolute; z-index:5; top:clamp(90px,14vh,140px); left:50%; transform:translateX(-50%); font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:12px; white-space:nowrap}
  .kick .d{width:7px; height:7px; border-radius:50%; background:var(--ice); box-shadow:0 0 12px var(--ice)}

  .foot{position:absolute; z-index:5; left:50%; bottom:clamp(48px,10vh,104px); transform:translateX(-50%); width:min(780px,90vw); text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px}
  .foot h1{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:clamp(1.9rem,4.6vw,3.4rem); line-height:1; letter-spacing:-.035em; margin:0}
  .foot h1 em{font-style:italic; color:var(--pop)}
  .row{display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap}
  .btn{font-family:"Spline Sans Mono",monospace; font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600; padding:15px 24px; border-radius:999px; background:var(--pop); color:#fff}
  .ghost{font-family:"Spline Sans Mono",monospace; font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--fg); border-bottom:1px solid var(--ice); padding-bottom:4px}
</style>

<div id="stage">
  <div class="corebox">
    <video autoplay muted loop playsinline preload="auto">
      <source src="videos/make_the_AI_rotate_blink_and.mp4" type="video/mp4">
    </video>
  </div>
  <div class="vig" aria-hidden="true"></div>

  <header class="bar">
    <a class="brand" href="#" aria-label="Optimazi"><span class="mk">O</span><span>Optim<i>a</i>zi</span></a>
    <a class="cta" href="#">Book a demo</a>
  </header>

  <div class="kick"><span class="d"></span>Optimazi · AI fabric-cost optimizer</div>

  <div class="foot">
    <h1>The AI that finds the fabric <em>you're wasting.</em></h1>
    <div class="row">
      <a class="btn" href="#">Book a demo</a>
      <a class="ghost" href="#">See how it works</a>
    </div>
  </div>
</div>
