<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimazi Core Burst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --pop:#FF5D2E; --ice:#7FC4FF; --fg:#EAF2FA; --dim:#8FA3B8; }
  *{box-sizing:border-box} a{color:inherit; text-decoration:none}
  html,body{margin:0; height:100%; background:#06131B; color:var(--fg); font-family:"Hanken Grotesk",system-ui,sans-serif; overflow:hidden}
  #stage{position:fixed; inset:0; overflow:hidden}
  #core{position:absolute; inset:0; display:block; z-index:1}
  .grain{position:absolute; inset:-50%; z-index:2; pointer-events:none; opacity:.28; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:grain 6s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-2%)}75%{transform:translate(-2%,4%)}100%{transform:translate(0,0)}}
  .vig{position:absolute; inset:0; z-index:3; pointer-events:none; box-shadow:inset 0 0 300px 90px rgba(3,8,14,.85)}

  .bar{position:absolute; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; justify-content:space-between; padding:24px clamp(24px,5vw,60px)}
  .brand{display:flex; align-items:center; gap:12px; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:1.4rem; letter-spacing:-.02em; color:var(--fg)}
  .brand .mk{width:28px; height:28px; border:1.5px solid var(--ice); border-radius:8px; display:grid; place-items:center; font-size:.92rem; color:var(--ice)}
  .brand i{font-style:normal; color:var(--pop)}
  .cta{font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; padding:12px 18px; border-radius:999px; background:var(--pop); color:#fff}

  .kick{position:absolute; z-index:5; top:clamp(92px,15vh,150px); left:50%; transform:translateX(-50%); font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:12px; white-space:nowrap}
  .kick .d{width:7px; height:7px; border-radius:50%; background:var(--ice); box-shadow:0 0 12px var(--ice)}

  .foot{position:absolute; z-index:5; left:50%; bottom:clamp(52px,11vh,110px); transform:translateX(-50%); width:min(760px,88vw); text-align:center; display:flex; flex-direction:column; align-items:center; gap:24px}
  .foot h1{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:clamp(1.9rem,4.6vw,3.4rem); line-height:1; letter-spacing:-.035em; margin:0}
  .foot h1 em{font-style:italic; color:var(--pop)}
  .row{display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap}
  .btn{font-family:"Spline Sans Mono",monospace; font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600; padding:15px 24px; border-radius:999px; background:var(--pop); color:#fff}
  .ghost{font-family:"Spline Sans Mono",monospace; font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--fg); border-bottom:1px solid var(--ice); padding-bottom:4px}
  @media (prefers-reduced-motion:reduce){ .grain{animation:none} }
</style>

<div id="stage">
  <canvas id="core" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>

  <header class="bar">
    <a class="brand" href="#" aria-label="Optimazi"><span class="mk">O</span><span>Optim<i>a</i>zi</span></a>
    <a class="cta" href="#">Book a demo</a>
  </header>

  <div class="kick"><span class="d"></span>Optimazi · AI fabric-cost optimizer</div>

  <div class="foot">
    <h1>The AI that finds the fabric <em>you're wasting.</em></h1>
    <div class="row">
      <a class="btn" href="#">Book a demo</a>
      <a class="ghost" href="#">See how it works</a>
    </div>
  </div>
</div>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("core"), ctx=cv.getContext("2d"), W,H,DPR, cx,cy,R,maxLen;
  function size(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W*0.5; cy=H*0.46; R=Math.min(W,H)*0.135; maxLen=Math.min(W,H)*0.62; }
  addEventListener("resize", size); size();

  function glow(x,y,r,rgb,a){ var g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,"rgba("+rgb+","+a+")"); g.addColorStop(0.5,"rgba("+rgb+","+(a*0.4)+")"); g.addColorStop(1,"rgba("+rgb+",0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); }

  // particle sphere (Fibonacci distribution)
  var N=560, pts=[], GA=2.399963;
  for(var i=0;i<N;i++){ var y=1-(i/(N-1))*2, rr=Math.sqrt(Math.max(0,1-y*y)), th=i*GA, jit=0.86+Math.random()*0.24;
    pts.push({x:Math.cos(th)*rr*jit, y:y*jit, z:Math.sin(th)*rr*jit, ph:Math.random()*6.283, warm:(y<-0.35 && Math.random()<0.5)}); }

  // radial flares
  var M=100, rays=[];
  for(var r=0;r<M;r++){ var a0=(r/M)*6.283 + (Math.random()-0.5)*0.05;
    var down=Math.sin(a0); // >0 points down
    var warm = (down>0.55 && Math.random()<0.7);
    rays.push({a:a0, len:0.32+Math.random()*(Math.random()<0.12?1.0:0.6), w:0.8+Math.random()*1.8, warm:warm, ph:Math.random()*6.283, sp:0.7+Math.random()*1.6}); }

  var ICE="120,200,255", ICE2="90,165,235", WARM="255,120,45", WHITE="225,242,255";
  var raf;
  function frame(ts){
    var t=ts||0;
    ctx.globalCompositeOperation="source-over"; ctx.fillStyle="#06131B"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";

    // ---- pop (periodic burst) + breathe ----
    var period=2800, ph=(t%period)/period; var pop=Math.pow(Math.max(0,1-ph*3.2),2.2);
    var breathe=0.5+0.5*Math.sin(t*0.0016);
    var sc=R*(1+pop*0.16+breathe*0.02);

    // ---- underlying glow ----
    glow(cx,cy, R*3.0, ICE, 0.10+pop*0.06);
    glow(cx,cy+R*0.55, R*1.5, WARM, 0.10+pop*0.05);
    glow(cx,cy, R*0.7*(1+pop*0.4), WHITE, 0.35+pop*0.35);

    // ---- flares ----
    var rot=t*0.00005;
    for(var r=0;r<rays.length;r++){ var b=rays[r];
      var flick=0.55+0.45*Math.sin(t*0.004*b.sp+b.ph);
      var len=maxLen*b.len*(0.7+0.3*flick)*(1+pop*0.9);
      var bright=(b.warm?0.5:0.42)*(0.35+0.65*flick)*(0.55+pop*0.8);
      var col=b.warm?WARM:ICE;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.a+rot);
      var g=ctx.createLinearGradient(0,0,len,0);
      g.addColorStop(0,"rgba("+col+","+bright+")");
      g.addColorStop(0.12,"rgba("+col+","+(bright*0.55)+")");
      g.addColorStop(1,"rgba("+col+",0)");
      ctx.fillStyle=g; var w0=b.w*(0.8+pop*0.6);
      ctx.beginPath(); ctx.moveTo(0,-w0); ctx.lineTo(len,-w0*0.3); ctx.lineTo(len,w0*0.3); ctx.lineTo(0,w0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // ---- rotating particle sphere ----
    var ay=t*0.00030, ax=0.32+Math.sin(t*0.00018)*0.12;
    var cY=Math.cos(ay), sY=Math.sin(ay), cX=Math.cos(ax), sX=Math.sin(ax);
    for(var i=0;i<pts.length;i++){ var p=pts[i];
      var x1=p.x*cY - p.z*sY, z1=p.x*sY + p.z*cY;
      var y2=p.y*cX - z1*sX, z2=p.y*sX + z1*cX;
      var depth=(z2+1)/2;
      var sx=cx+x1*sc, sy=cy+y2*sc;
      var tw=0.45+0.55*Math.sin(t*0.005+p.ph*9);
      var a=(0.18+0.82*depth)*tw*(0.7+pop*0.5);
      var sz=(0.7+1.7*depth)*(1+pop*0.3);
      var col=p.warm?WARM:(depth>0.72?WHITE:ICE2);
      ctx.fillStyle="rgba("+col+","+a+")";
      ctx.beginPath(); ctx.arc(sx,sy,sz,0,6.283); ctx.fill();
    }

    if(!reduce) raf=requestAnimationFrame(frame);
  }
  if(reduce){ frame(700); } else { raf=requestAnimationFrame(frame);
    document.addEventListener("visibilitychange", function(){ if(document.hidden){ cancelAnimationFrame(raf); } else { raf=requestAnimationFrame(frame); } }); }
})();
</script>
